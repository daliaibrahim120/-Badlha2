<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بدّلها - إنشاء حساب</title>
</head>

<body>

    <header>
        <h1>♻️ بدّلها</h1>
        <h2>إنشاء حساب جديد</h2>
        <p>انضم إلينا وساهم في إعادة استخدام الأشياء.</p>
    </header>

    <hr>

    <main>

        <form action="login.html" method="get">

            <label for="fullname">الاسم الكامل:</label>
            <br>
            <input type="text"
                   id="fullname"
                   name="fullname"
                   placeholder="اكتب اسمك الكامل"
                   required>

            <br><br>

            <label for="email">البريد الإلكتروني:</label>
            <br>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="example@email.com"
                   required>

            <br><br>

            <label for="phone">رقم الهاتف:</label>
            <br>
            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="أدخل رقم هاتفك"
                   required>

            <br><br>

            <label for="newusername">اسم المستخدم:</label>
            <br>
            <input type="text"
                   id="newusername"
                   name="username"
                   placeholder="اختر اسم مستخدم"
                   required>

            <br><br>

            <label for="newpassword">كلمة المرور:</label>
            <br>
            <input type="password"
                   id="newpassword"
                   name="password"
                   placeholder="أنشئ كلمة مرور"
                   required>

            <br><br>

            <button type="submit">
                إنشاء الحساب
            </button>

        </form>

        <p>
            لديك حساب بالفعل؟
            <a href="index.html">تسجيل الدخول</a>
        </p>

    </main>

    <hr>

    <footer>
        <p>بدّلها ♻️</p>
    </footer>

</body>

</html>

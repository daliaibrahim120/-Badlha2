<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بدّلها - تسجيل الدخول</title>
</head>

<body>

    <header>
        <h1>♻️ بدّلها</h1>
        <p>تبادل الأشياء المستعملة وحافظ على البيئة</p>
    </header>

    <hr>

    <main>

        <h2>تسجيل الدخول</h2>

        <p>أهلاً بعودتك! سجّل دخولك للمتابعة.</p>

        <form action="login.html" method="get">

            <label for="username">اسم المستخدم:</label>
            <br>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="أدخل اسم المستخدم"
                   required>

            <br><br>

            <label for="password">كلمة المرور:</label>
            <br>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="أدخل كلمة المرور"
                   required>

            <br><br>

            <button type="submit">
                تسجيل الدخول
            </button>
            <button id="exitBtn" class="exit-btn">خروج </button>
        </form>

        <hr>

        <h3>ليس لديك حساب؟</h3>

        <a href="register.html">إنشاء حساب جديد</a>
        
    </main>

    <hr>

    <footer>
        <p>بدّلها ♻️ - معاً نحو بيئة أفضل</p>
    </footer>

</body>

</html>
